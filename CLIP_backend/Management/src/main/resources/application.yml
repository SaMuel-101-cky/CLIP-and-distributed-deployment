server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
spring:
  application:
    name: item-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${hw.db.sql.host}:3306/photo_system?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hw.db.sql.pw}
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapUnderscoreToCamelCase: true # 开启驼峰命名自动映射
  mapper-locations: classpath:com.hw.manage.Mapper/*.xml
logging:
  level:
    com.hw: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 图库管理系统接口文档
    description: "图库管理系系统接口文档"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hw.manage.controller
# 统一管理文件上传相关的配置
file:
  # 1. 定义外部可访问的URL前缀（例如：http://localhost:8080/images/）
  access-path: /images/

  # 2. 开发阶段默认存到本地磁盘。可用环境变量 CLIP_UPLOAD_DIR 覆盖为云盘挂载目录。
  upload-dir: ${CLIP_UPLOAD_DIR:photo_resources}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:5000}
  callback:
    token: ${AI_CALLBACK_TOKEN:}
